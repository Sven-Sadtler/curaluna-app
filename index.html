<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>CURALUNA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#hit{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;touch-action:none}
</style>
</head>
<body>
<main id="app" aria-label="CURALUNA Vollbild-Demo">
<img id="screen" src="./screens/screen_004.png" alt="CURALUNA" draggable="false">
<button id="hit" aria-label="CURALUNA bedienen"></button>
</main>
<script>
(()=>{
 const app=document.getElementById('app'),img=document.getElementById('screen');
 const files={
  start:'screen_004.png', planned:'screen_011.png', formTop:'screen_013.png', formBottom:'screen_014.png',
  calibration:'screen_015.png', actions:'screen_016.png', history:'screen_018.png', detail:'screen_020.png',
  urgent:'screen_026.png', urgentTop:'screen_028.png', urgentBottom:'screen_029.png',
  urgentCalibration:'screen_030.png', urgentHistory:'screen_031.png', urgentDetail:'screen_033.png',
  extra:'Bild extra 1.png'
 };
 let state='start', startPoint=null;
 function show(s){if(!files[s])return;state=s;img.src='./screens/'+encodeURIComponent(files[s]);}
 function point(e){const r=app.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
 function tap(p){
  // Visible controls are clickable only on screens and areas shown in the user's diagram.
  if(state==='planned' && p.y>.68 && p.y<.88 && p.x>.12&&p.x<.90){show('formTop');return}
  if(state==='urgent' && p.y>.68 && p.y<.88 && p.x>.12&&p.x<.90){show('urgentTop');return}
  if(state==='formBottom' && p.y>.78 && p.y<.95 && p.x>.08&&p.x<.93){show('calibration');return}
  if(state==='urgentBottom' && p.y>.78 && p.y<.95 && p.x>.08&&p.x<.93){show('urgentCalibration');return}
  if(['calibration','actions','urgentCalibration'].includes(state)){
   if(p.y>.88 && p.x<.25){show(state==='urgentCalibration'?'urgent':'actions');return}
   if(p.y>.88 && p.x>.25&&p.x<.52){show(state==='urgentCalibration'?'urgentHistory':'history');return}
  }
  if(state==='history'&&p.y>.18&&p.y<.88){show('detail');return}
  if(state==='urgentHistory'&&p.y>.18&&p.y<.88){show('urgentDetail');return}
  if(['detail','urgentDetail'].includes(state)&&p.y>.88&&p.x<.25){show(state==='urgentDetail'?'urgent':'actions');return}
  // The bottom navigation's "Aktionen" item is an explicit route back.
  if(p.y>.88&&p.x<.25){show(state.startsWith('urgent')?'urgent':'actions');return}
 }
 function swipe(dx,dy,from){
  const ax=Math.abs(dx),ay=Math.abs(dy);
  // Start / action screens: lateral swipes toggle the planned and urgent routes.
  if(state==='start'){if(ax>ay*1.1){show('planned');return true}return false}
  if(state==='planned'){
   if(ax>ay*1.1){show('start');return true}
   if(dy>0&&ay>ax*1.1){show('urgent');return true}
   return false;
  }
  if(state==='urgent'){
   if(ax>ay*1.1){show('start');return true}
   if(dy<0&&ay>ax*1.1){show('planned');return true}
   return false;
  }
  // Forms: vertical swipe down scrolls to the lower form; opposite direction returns.
  if(state==='formTop'){if(dy<0&&ay>ax){show('formBottom');return true}if(ax>ay){show('calibration');return true}return false}
  if(state==='formBottom'){if(dy>0&&ay>ax){show('formTop');return true}if(ax>ay){show('calibration');return true}return false}
  if(state==='urgentTop'){if(dy<0&&ay>ax){show('urgentBottom');return true}if(ax>ay){show('urgentCalibration');return true}return false}
  if(state==='urgentBottom'){if(dy>0&&ay>ax){show('urgentTop');return true}if(ax>ay){show('urgentCalibration');return true}return false}
  // Adjacent action / calibration screens can be reached in either lateral direction.
  if(state==='calibration'){if(ax>ay){show('actions');return true}if(dy>0&&ay>ax){show('formBottom');return true}return false}
  if(state==='actions'){if(ax>ay){show('calibration');return true}if(dy>0&&ay>ax){show('urgentCalibration');return true}return false}
  if(state==='urgentCalibration'){if(ax>ay){show('urgent');return true}if(dy<0&&ay>ax){show('urgentBottom');return true}return false}
  // History and details: lateral swipes go between list and selected detail.
  if(state==='history'){if(ax>ay){show('detail');return true}if(dy>0&&ay>ax){show('actions');return true}return false}
  if(state==='detail'){if(ax>ay){show('history');return true}if(dy>0&&ay>ax){show('actions');return true}return false}
  if(state==='urgentHistory'){if(ax>ay){show('urgentDetail');return true}if(dy>0&&ay>ax){show('urgentCalibration');return true}return false}
  if(state==='urgentDetail'){if(ax>ay){show('urgentHistory');return true}if(dy>0&&ay>ax){show('urgentCalibration');return true}return false}
  return false;
 }
 app.addEventListener('pointerdown',e=>{startPoint={x:e.clientX,y:e.clientY};try{app.setPointerCapture(e.pointerId)}catch{};e.preventDefault()},{passive:false});
 app.addEventListener('pointerup',e=>{if(!startPoint)return;const dx=e.clientX-startPoint.x,dy=e.clientY-startPoint.y;const threshold=Math.max(28,Math.min(app.clientWidth,app.clientHeight)*.045);if(Math.abs(dx)>threshold||Math.abs(dy)>threshold)swipe(dx,dy,startPoint);else tap(point(e));startPoint=null;e.preventDefault()},{passive:false});
 app.addEventListener('pointercancel',()=>startPoint=null);
 // Every new document launch always starts at screen_004.
 show('start');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
