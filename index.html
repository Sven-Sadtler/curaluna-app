<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>CURALUNA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#hotspot{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;touch-action:none}
</style>
</head>
<body>
<main id="app" aria-label="CURALUNA Vollbild-Demo"><img id="screen" src="./screens/screen_004.png" alt="CURALUNA" draggable="false"><button id="hotspot" aria-label="CURALUNA bedienen"></button></main>
<script>
(()=>{
 const img=document.getElementById('screen'), app=document.getElementById('app');
 const files={start:'screen_004.png', planned:'screen_011.png', formTop:'screen_013.png', formBottom:'screen_014.png', calibration:'screen_015.png', updated:'screen_016.png', history:'screen_018.png', detail:'screen_020.png', urgent:'screen_026.png', urgentTop:'screen_028.png', urgentBottom:'screen_029.png', urgentCal:'screen_030.png', urgentHistory:'screen_031.png', urgentDetail:'screen_033.png'};
 let state='start';
 function show(s){state=s;img.src='./screens/'+files[s];}
 function pos(e){const r=app.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
 function tap(p){
  // Start actions screen: only swipe selects an action; tap on visible buttons is not a generic next.
  if(state==='planned' && p.y>.60 && p.y<.84 && p.x>.08&&p.x<.92){show('formTop');return}
  if(state==='urgent' && p.y>.60 && p.y<.84 && p.x>.08&&p.x<.92){show('urgentTop');return}
  if((state==='formBottom'||state==='urgentBottom') && p.y>.82 && p.y<.97 && p.x>.08&&p.x<.92){show(state==='formBottom'?'calibration':'urgentCal');return}
  if((state==='updated'||state==='calibration'||state==='urgentCal') && p.y>.89 && p.x<.27){show('updated');return}
  if((state==='updated'||state==='calibration'||state==='urgentCal') && p.y>.88 && p.x>.25&&p.x<.51){show(state==='urgentCal'?'urgentHistory':'history');return}
  if(state==='history' && p.y>.20 && p.y<.88){show('detail');return}
  if(state==='urgentHistory' && p.y>.20 && p.y<.88){show('urgentDetail');return}
 }
 let start=null, moved=false;
 app.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};moved=false;try{app.setPointerCapture(e.pointerId)}catch{}},{passive:false});
 app.addEventListener('pointerup',e=>{
  if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;const w=app.clientWidth,h=app.clientHeight;const ax=Math.abs(dx)/w,ay=Math.abs(dy)/h;
  if(Math.max(ax,ay)>.055){moved=true;
   // Only screens explicitly marked for swiping respond to swipes.
   if(state==='start' && ax>.07){show(dx<0?'planned':'urgent');}
   else if((state==='calibration'||state==='urgentCal')&&ax>.07){show('updated');}
   else if((state==='detail'||state==='urgentDetail')&&dy>.08){show('start');}
   else if((state==='formTop'||state==='urgentTop')&&dy<-.08){show(state==='formTop'?'formBottom':'urgentBottom');}
  }else{tap(pos(e))}
  start=null;
 },{passive:false});
 app.addEventListener('pointercancel',()=>{start=null});
 // Always begin at screen_004.png on each fresh app/document start.
 show('start');
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
