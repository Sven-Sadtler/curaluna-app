let current=0,toastTimer;
const img=document.getElementById('screen'),toast=document.getElementById('toast');
function show(id){
 current=Math.max(0,Math.min(screens.length-1,id));
 const s=screens[current]; img.src=s.file;
 document.getElementById('change').style.display=s.isHistory?'none':'block';
 document.getElementById('profile').style.display=(s.isHistory||s.isForm)?'none':'block';
 ['row1','row2','row3','row4','row5'].forEach(id=>document.getElementById(id).style.display=s.isHistory?'block':'none');
}
function notice(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1300)}
document.getElementById('change').addEventListener('click',()=>show(screens[current].actionId));
document.getElementById('profile').addEventListener('click',()=>show(screens[current].nextId));
document.getElementById('tab-actions').addEventListener('click',()=>show(screens[current].actionTab));
document.getElementById('tab-history').addEventListener('click',()=>show(screens[current].historyTab));
document.getElementById('tab-patient').addEventListener('click',()=>show(screens[current].patientTab));
document.getElementById('tab-settings').addEventListener('click',()=>notice('Eine separate Einstellungsansicht ist in den gelieferten Screenshots nicht enthalten.'));
document.getElementById('more').addEventListener('click',()=>notice('Weitere Optionen – Demo'));
document.getElementById('bell').addEventListener('click',()=>show(screens[current].historyTab));
['row1','row2','row3','row4','row5'].forEach(id=>document.getElementById(id).addEventListener('click',()=>show(screens[current].nextId)));
let sx=null,sy=null;
document.getElementById('app').addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{if(sx===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)show(current+(dx<0?1:-1));sx=null;sy=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
show(0);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
