<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>CURALUNA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#hit{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;touch-action:none}
</style>
</head>
<body>
<main id="app" aria-label="CURALUNA Vollbild-Demo">
<img id="screen" src="./screens/screen_004.png" alt="CURALUNA" draggable="false">
<button id="hit" aria-label="CURALUNA bedienen"></button>
</main>
<script>
(()=>{
 const app=document.getElementById('app'),img=document.getElementById('screen');
 const files={
  start:'screen_004.png', planned:'screen_011.png', formTop:'screen_013.png', formBottom:'screen_014.png',
  calibration:'screen_015.png', actions:'screen_016.png', history:'screen_018.png', detail:'screen_020.png',
  urgent:'screen_026.png', urgentTop:'screen_028.png', urgentBottom:'screen_029.png',
  urgentCalibration:'screen_030.png', urgentHistory:'screen_031.png', urgentDetail:'screen_033.png',
  extra:'Bild extra 1.png'
 };
 let state='start',startPoint=null;
 function show(s){if(!files[s])return;state=s;img.src='./screens/'+encodeURIComponent(files[s]);}
 // Each neighboring pair in the supplied diagram can be traversed by the indicated
 // left/right swipe. A swipe in the opposite direction returns to the previous view.
 const horizontal={
  start:{left:'planned'},
  planned:{right:'start',left:'formTop'},
  formTop:{right:'planned',left:'formBottom'},
  formBottom:{right:'formTop',left:'calibration'},
  calibration:{right:'formBottom',left:'actions'},
  actions:{right:'calibration',left:'history'},
  history:{right:'actions',left:'detail'},
  detail:{right:'history'},
  urgent:{left:'urgentTop'},
  urgentTop:{right:'urgent',left:'urgentBottom'},
  urgentBottom:{right:'urgentTop',left:'urgentCalibration'},
  urgentCalibration:{right:'urgentBottom',left:'urgentHistory'},
  urgentHistory:{right:'urgentCalibration',left:'urgentDetail'},
  urgentDetail:{right:'urgentHistory'}
 };
 const vertical={
  planned:{down:'urgent'},
  urgent:{up:'planned'},
  actions:{down:'urgent'},
  urgentCalibration:{up:'urgentBottom'},
  history:{down:'actions'},
  detail:{down:'actions'},
  urgentHistory:{down:'urgentCalibration'},
  urgentDetail:{down:'urgentCalibration'}
 };
 function point(e){const r=app.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
 function tap(p){
  // Main action button on the planned/urgent action card.
  if(state==='planned'&&p.y>.67&&p.y<.88&&p.x>.10&&p.x<.92){show('formTop');return}
  if(state==='urgent'&&p.y>.67&&p.y<.88&&p.x>.10&&p.x<.92){show('urgentTop');return}
  // Form confirmation button.
  if(state==='formBottom'&&p.y>.77&&p.y<.95&&p.x>.07&&p.x<.94){show('calibration');return}
  if(state==='urgentBottom'&&p.y>.77&&p.y<.95&&p.x>.07&&p.x<.94){show('urgentCalibration');return}
  // Bottom navigation: Aktionen / Historie, where visible in the screenshots.
  if(p.y>.88&&p.x<.27){
   if(state.startsWith('urgent'))show('urgent');else show('start');
   return;
  }
  if(p.y>.88&&p.x>=.27&&p.x<.52){
   show(state.startsWith('urgent')?'urgentHistory':'history');return;
  }
  // Tap a history row to open its detail.
  if(state==='history'&&p.y>.18&&p.y<.86){show('detail');return}
  if(state==='urgentHistory'&&p.y>.18&&p.y<.86){show('urgentDetail');return}
  // In detail, the back/action tab returns to the action view.
  if((state==='detail'||state==='urgentDetail')&&p.y>.88&&p.x<.27){show(state==='urgentDetail'?'urgent':'start');return}
 }
 function swipe(dx,dy){
  const ax=Math.abs(dx),ay=Math.abs(dy),threshold=Math.max(28,Math.min(app.clientWidth,app.clientHeight)*.045);
  if(Math.max(ax,ay)<threshold)return false;
  if(ax>ay*1.15){
   const dir=dx<0?'left':'right',next=horizontal[state]?.[dir];
   if(next){show(next);return true}
   return false;
  }
  if(ay>ax*1.15){
   const dir=dy<0?'up':'down',next=vertical[state]?.[dir];
   if(next){show(next);return true}
   return false;
  }
  return false;
 }
 app.addEventListener('pointerdown',e=>{startPoint={x:e.clientX,y:e.clientY};try{app.setPointerCapture(e.pointerId)}catch{};e.preventDefault()},{passive:false});
 app.addEventListener('pointerup',e=>{
  if(!startPoint)return;
  const dx=e.clientX-startPoint.x,dy=e.clientY-startPoint.y;
  if(Math.hypot(dx,dy)>Math.max(28,Math.min(app.clientWidth,app.clientHeight)*.045))swipe(dx,dy);
  else tap(point(e));
  startPoint=null;e.preventDefault();
 },{passive:false});
 app.addEventListener('pointercancel',()=>startPoint=null);
 // Every fresh page/app launch starts on screen_004, never the previous state.
 show('start');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
